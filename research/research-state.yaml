# Research State — Central Project Tracking
# Find Us (Crowd Compass) Research

project:
  title: "Find Us (Crowd Compass): Topological Hop-Count Gradient Field for Offline Smartphone Localization"
  question: "Can an ad-hoc smartphone mesh provide actionable emergency navigation using only a distributed hop-distance gradient and local biological shadowing, without global coordinates or metric vector chains?"
  status: active
  started: "2026-09-18"
  domain: "distributed systems, mobile ad-hoc networking, indoor localization, RF biophysics"

literature:
  key_papers:
    - id: "levis2011trickle"
      title: "The Trickle Algorithm (RFC 6206)"
      authors: "Levis et al."
      year: 2011
      relevance: "Basis for density-adaptive inhibitory rebroadcast suppression on BLE channels 37/38/39"
    - id: "cotton2009human"
      title: "Human Body Shadowing in 2.4-GHz Wireless Networks"
      authors: "Cotton et al."
      year: 2009
      relevance: "Quantifies 15-25 dB torso attenuation used as directional synthetic lighthouse"
    - id: "vahdat2000epidemic"
      title: "Epidemic Routing for Partially-Connected Ad Hoc Networks"
      authors: "Vahdat & Becker"
      year: 2000
      relevance: "Theoretical foundation of multi-hop opportunistic flooding and store-and-forward"
    - id: "harle2013indoor"
      title: "A Survey of Indoor Positioning Systems for Wireless Networks"
      authors: "Harle"
      year: 2013
      relevance: "Demonstrates fatal PDR heading drift near indoor magnetic anomalies"
  open_problems:
    - "Dynamic jitter window adaptation under extreme (>5,000 node) dense flash mobs"
  resolved_problems:
    - "Background BLE scanning latency and iOS Service-UUID filter constraints resolved in B-01 (Doc 19)"
    - "Multi-story stairwell RF penetration and ceiling shadow trap resolved in B-10 (Doc 28)"
    - "Cross-vendor barometric baseline variance between Android and iOS resolved via turnstile snapshot in B-10 (Doc 28)"
  evidence_gaps:
    - "Field measurement of biological shadowing under dense stadium human clustering"

hypotheses:
  - id: H1
    statement: "A discrete Topological Hop-Count Gradient Field achieves >=95% monotonic descent success to origin regardless of hop distance, whereas continuous Vector-Chain integration accumulates quadratic transversal error >10m at >=4 hops."
    status: supported
    motivation: "Eliminates the global coordinate frame (0,0) and solves the outsider responder onboarding problem."
    parent: null
    priority: high

  - id: H2
    statement: "Uninhibited flooding across BLE primary advertising channels (37, 38, 39) causes >90% collision spectrum collapse at N >= 2,000 nodes; an Inhibitory Trickle Protocol (k=3, jitter 50-250ms) suppresses >=90% of redundant transmissions."
    status: supported
    motivation: "Prevents the emergency network from silencing itself during mass concert gatherings."
    parent: null
    priority: high

  - id: H3
    statement: "Holding a single-antenna smartphone against the human sternum during a 360-degree torso rotation leverages 15-20 dB body attenuation to determine the line-of-bearing to a beacon with mean angular error <= 20 degrees, achieving >=4x gain over an omnidirectional phone."
    status: supported
    motivation: "Solves the 'Which Way' local directional ambiguity without requiring locked-down BLE 5.1 AoA APIs."
    parent: null
    priority: high

  - id: H4
    statement: "In non-convex venues with acoustic stage barriers, naive hop descent causes >8x detour penalties; direct RF bleed packet detection (< -90 dBm) flags barrier presence with >90% warning coverage."
    status: supported
    motivation: "Prevents responders from walking 120m around barriers when the target is 10m away behind a wall."
    parent: null
    priority: medium

  - id: H5
    statement: "Under extreme stadium flash mob densities (N >= 2,500), fixed Trickle jitter windows (50-250ms) collapse to <15% delivery; logarithmic adaptive jitter scaling (T_max ~ log2(N)) restores delivery rate by >60%."
    status: supported
    motivation: "Guarantees mesh scalability up to 10,000 active devices per venue."
    parent: null
    priority: high

  - id: H6
    statement: "A Dual-Compartment Encrypted Mesh Frame (Public Envelope + Authenticated Ciphertext) fits within the 31-byte legacy BLE advertisement limit while allowing intermediate altruistic relays to process and increment hop counters with zero decryption overhead (<0.05 ms vs 0.85 ms), achieving 100% payload confidentiality and <2 mAh/day bystander battery drain."
    status: supported
    motivation: "Enables private group tracking and stranger altruistic relaying without compromising user privacy or phone battery."
    parent: null
    priority: high

  - id: H7
    statement: "Under chaotic crowd motion, naive PDR integration fails to converge to the target in >30% of cases due to spurious acceleration vectors, whereas a purely Topological Hop-Count Gradient Field maintains 100% arrival success by gating out corrupted kinematic updates."
    status: supported
    motivation: "Ensures the system does not fail when users are dancing, jumping, or getting pushed in dense crowds."
  - id: B-08
    statement: "Under near-field crowd blockage (16 dB body shadow at 1.2m), a Combined Terminal Handoff Protocol (coarse torso scan + 3-step Hot/Cold verification walk) resolves reflection flips and clears obstacle bodies, achieving <=30° angular bias in 89.96% to 100% of cases and >=88.35% terminal arrival (<=5m) compared to 79.92% for pure torso scan and 29.59% for pure Hot/Cold walk."
    status: supported
    motivation: "Solves Teardown Issue #2 (near-field waterbag blockage and crowd confinement) in the final 15m terminal zone."
    parent: "H3"
    priority: critical
  - id: B-09
    statement: "Under delay-tolerant data muling across a 200m crowd partition void, unmitigated Hop-0 rebroadcasting misleads 46-100% of searchers toward moving bystander mules (331-11,200 false Hop-1 alerts); a Definitive Multi-Layer Receiver Decision Rule (Wire metadata + 16-bit MAC origin invariance + Epoch Cadence Delta Gating + Static Freeze Detector) achieves 0.0 false Hop-1 alerts (0.0% misled rate) even under 15% non-compliant mules, yielding 100% partition delivery at >=4.0 mules/min (ETUI arc error <= 23.7°) and 0.00% false negative rate on live proximate targets."
    status: supported
    motivation: "Solves Doc 17 Open Question §4 (The Ghost Gradient catastrophe) and enables safe delay-tolerant partition healing."
    parent: "H9"
    priority: critical
  - id: B-10
    statement: "Under multi-deck structures, reinforced concrete floor slabs (22 dB loss) bleed BLE naturally (+15.8 dB margin), trapping 100.0% of searchers under the victim's ceiling projection (0% arrival) under naive 2D hop descent; Floor-Aware Receiver Gating (suppressing in-plane descent when |BARO_DIFF| > 0.35 hPa and routing to stairwells) restores arrival to 100.0% (0% entrapment); Entrance-Gate Baseline Snapshot against reference P_0 eliminates cross-OS sensor bias (<=0.244 floor MAFE, 100% within +-1 floor)."
    status: supported
    motivation: "Resolves findings.md Open Questions 1 and 2, enabling reliable 3D multi-level arena navigation."
    parent: "H1"
    priority: critical
  - id: B-11
    statement: "Consolidation of B-01 through B-10 into ONE canonical implementation blueprint (29_IMPLEMENTATION_BLUEPRINT_V1.md) and concise machine-readable specification (refimpl_spec.md) provides an airtight, zero-discrepancy build reference across wire format (56-bit Packet v2, 13B Hamming FEC, 23B Dual-AD iOS ceiling), executable node state machines, 3-tier responder guidance engine, 18-point failure mode resolution matrix, and multi-year hardware risk register."
    status: supported
    motivation: "Formally closes Volume 1 Research and establishes authoritative specification for engineering build phase."
    parent: null
    priority: critical

