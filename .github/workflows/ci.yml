name: ci

on:
  push:
  pull_request:

jobs:
  # Reference-verified Python stack: packet PDU, ~91 adversarial checks,
  # cross-language canonical vectors, compat/direction battery.
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Packet v2 PDU verification (56-bit frame, FEC, MAC, framing)
        run: python3 core/python/packet_v2.py
      - name: Robustness audit (adversarial phone-to-phone checks)
        run: PYTHONPATH=core:app python3 tests/robustness_suite.py
      - name: Cross-language canonical vector check
        run: python3 tests/cross_language_test.py
      - name: Compat / direction battery
        run: PYTHONPATH=core python3 tests/test_compat_direction.py

  # Android app compiles + the Kotlin packet layer re-certifies on the JVM.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"
      - name: Build debug app + run unit tests
        working-directory: android
        run: gradle assembleDebug testDebugUnitTest --no-daemon

  # iOS app builds and the engine parity battery runs in a simulator.
  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml --project .
      - name: Engine parity battery (simulator)
        working-directory: ios
        run: |
          xcrun xcodebuild test \
            -project FindUsCrowd.xcodeproj \
            -scheme FindUsApp \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -only-testing:FindUsEngineTests
      - name: Build app for device (no code signing)
        working-directory: ios
        run: |
          xcrun xcodebuild build \
            -project FindUsCrowd.xcodeproj \
            -scheme FindUsApp \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO